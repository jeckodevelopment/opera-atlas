name: Verify Cosenza ticketing source (targeted)
run-name: Cosenza partner probe · ${{ github.ref_name }}
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-cosenza-inprimafila.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test Cosenza source adapter
        run: python -m unittest tests.test_cosenza_inprimafila_opera -v
      - name: Probe partner index, season programme, and surviving event pages
        run: |
          python - <<'PY'
          from opera_atlas.db import connect, migrate
          from opera_atlas.controlled_fetch import fetch_official_html
          from opera_atlas.cosenza_inprimafila_opera import (
              INDEX, extract_index, parse_detail, parse_season_summary,
          )
          origin = "https://www.inprimafila.net/"
          expected = {
              "le-nozze-di-figaro-cosenza": 2,
              "la-mere-coupable-cosenza": 1,
          }
          db = connect()
          try:
              migrate(db)
              db.execute(
                  "INSERT OR IGNORE INTO sources(official_url,access_status) VALUES (?, 'approved')",
                  (origin,),
              )
              row = db.execute(
                  "SELECT id FROM sources WHERE official_url=?", (origin,)
              ).fetchone()
              def fetch(url):
                  return fetch_official_html(
                      db, source_id=row["id"], url=url, network_enabled=True,
                  ).html
              html = fetch(INDEX)
              candidates = extract_index(html, url=INDEX, min_links=3)
              print("Cosenza partner: eligible official event URLs:", len(candidates))
              recitals = []
              for slug, count in expected.items():
                  urls = [url for url in candidates if url.rstrip("/").endswith("/"+slug)]
                  if len(urls) != 1:
                      raise RuntimeError(f"Missing / ambiguous Rendano opera: {slug}")
                  parsed = parse_detail(fetch(urls[0]), url=urls[0])
                  if len(parsed[3]) != count:
                      raise RuntimeError(f"Incorrect recital count for {slug}")
                  print(parsed[0], parsed[1], parsed[2], parsed[3])
                  recitals.extend(parsed[3])
              season = [u for u in candidates if u.rstrip("/").endswith("/stagione-lirica-2026-cosenza")]
              if len(season) != 1:
                  raise RuntimeError("Missing / ambiguous official mixed-season page")
              productions = parse_season_summary(fetch(season[0]),url=season[0])
              observed = {title: rows for title,_,_,rows in productions}
              expected_titles = {
                  "Il barbiere di Siviglia": 2,
                  "Le nozze di Figaro": 2,
                  "La mère coupable": 1,
              }
              if {k:len(v) for k,v in observed.items()} != expected_titles:
                  raise RuntimeError("Official season summary has unexpected opera recitals")
              # Compare overlapping individual and season pages to identify
              # source discrepancies, not duplicate canonical productions.
              for title,_,_,rows in productions:
                  if title == "Le nozze di Figaro" and rows != parse_detail(
                          fetch(next(u for u in candidates if u.endswith("/le-nozze-di-figaro-cosenza"))),
                          url=next(u for u in candidates if u.endswith("/le-nozze-di-figaro-cosenza")))[3]:
                      raise RuntimeError("Nozze recital mismatch across source pages")
              print("PASS: mixed season lists 3 operas / 5 recitals, excluding ballet")
          finally:
              db.close()
          PY
