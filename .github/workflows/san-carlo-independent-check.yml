name: San Carlo independent showtime check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/san-carlo-independent-check.yml'
      - 'scripts/corroborate_san_carlo_secondary.py'
      - 'scripts/scan_san_carlo_secondary.py'
      - 'tests/test_san_carlo_independent_corroboration.py'
      - 'scripts/apply_san_carlo_corroborated.py'
      - 'tests/test_san_carlo_canonical_bridge.py'
      - 'data/san-carlo-authoritative-showtimes.json'
      - 'tests/test_san_carlo_secondary_probe.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/san-carlo-independent-check.yml'
      - 'scripts/corroborate_san_carlo_secondary.py'
      - 'tests/test_san_carlo_independent_corroboration.py'

permissions:
  contents: read

concurrency:
  group: san-carlo-independent-check
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test independent showtime comparator
        run: python -m unittest discover -s tests -p 'test_san_carlo_independent_corroboration.py' -v
      - name: Acquire San Carlo candidates only
        run: python -m scripts.scan_san_carlo_secondary --allow-network --sync-candidates
      - name: Compare independent live calendar with candidate dates
        run: |
          set -o pipefail
          python -m scripts.corroborate_san_carlo_secondary --allow-network --sync-review | tee "$RUNNER_TEMP/san-carlo-corroboration.json"
      - name: Verify real canonical queue in memory (no publication)
        run: |
          python - <<'PY'
          import json
          from scripts.apply_san_carlo_corroborated import apply, CHECKPOINT, CORROBORATION
          from scripts.discover_season_indexes import OUTPUT
          from scripts.collect_candidate_details import OUTPUT as DETAILS
          candidate = json.loads(CHECKPOINT.read_text())
          review = json.loads(CORROBORATION.read_text())
          registry = json.loads(OUTPUT.read_text())
          details = json.loads(DETAILS.read_text())
          # Exercise the full evidence gate independently of the live registry's
          # idempotent already_processed outcomes. No file is written.
          stamp = "2026-11-22T22:00:00Z"
          _, fresh_details, fresh = apply(candidate, review,
              {"schema_version": 1, "candidates": []},
              {"schema_version": 1, "evidence": []}, checked_at=stamp)
          if not fresh or any(x["status"] != "canonical_candidate_evidence_ready" for x in fresh):
              raise SystemExit("San Carlo fresh evidence gate held one or more productions")
          expected = {(p["title"], c["date"], c["candidate"], c["independent"])
                      for p in review["productions"] for c in p["conflicting_clocks"]}
          resolved = {(e["event_facts"][0]["event_title"], r["date"], r["time"],
                       r["overridden_secondary_time"])
                      for e in fresh_details["evidence"]
                      for r in e["corroboration"]["overridden_secondary_showtimes"]}
          if expected != resolved:
              raise SystemExit("San Carlo official authority did not resolve every secondary conflict")
          new_registry, new_details, outcomes = apply(candidate, review, registry, details,
                                                        checked_at=stamp)
          allowed = {"canonical_candidate_evidence_ready", "already_processed",
                     "stronger_primary_preserved"}
          if len(outcomes) != len(candidate["productions"]) or any(
              x["status"] not in allowed for x in outcomes):
              raise SystemExit("San Carlo live canonical bridge held one or more productions")
          again, _, repeated = apply(candidate, review, new_registry, new_details,
                                      checked_at=stamp)
          if {r["id"] for r in again["candidates"]} != {r["id"] for r in new_registry["candidates"]}:
              raise SystemExit("San Carlo repeat scan introduced duplicate candidate identities")
          print("San Carlo canonical bridge:", len(fresh), "fresh productions verified;",
                len(resolved), "official clock overrides verified;",
                sum(x["status"]=="already_processed" for x in outcomes), "already processed")
          PY
      - name: Describe review-only result
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          result=json.loads((Path(os.environ['RUNNER_TEMP'])/'san-carlo-corroboration.json').read_text())
          if result['dry_run'] or result['canonical_publication_authorized']:
              raise SystemExit('unsafe San Carlo secondary evidence')
          lines=[
              '## San Carlo — two-source recita cross-check',
              '',
              f"- Matching date/time observations: {result['matching_recite_count']}",
              f"- Conflicting date/time observations: {result['conflicting_recite_count']}",
              f"- Unmatched candidate observations: {result['unmatched_recite_count']}",
              '- Published records: 0',
              '- Official primary-page schedule takes precedence for corroborated conflicting clocks',
              '- Canonical review gate runs separately; published records: 0',
              '',
              '### Conflicts',
          ]
          for item in result['conflicts']:
              lines.append('- '+item['title'])
              for row in item['conflicts']:
                  lines.append(f"  - {row['date']}: ClassicaLive {row['candidate']}, EnjoyLive {row['independent']}")
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
              f.write('\n'.join(lines)+'\n')
          print('\n'.join(lines))
          PY
