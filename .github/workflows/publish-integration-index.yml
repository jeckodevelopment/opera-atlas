name: Publish Atlas integration index
on:
  workflow_run:
    workflows: ["Refresh public Opera Atlas catalog"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '43 10 * * *'
permissions:
  contents: write
concurrency:
  group: opera-atlas-integration-index
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 1
      - name: Generate from current committed snapshot
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          python -m unittest discover -s tests -p test_integration_index.py -v
          python -m scripts.publish_integration_index --revision "$revision"
          git diff --exit-code -- public/catalog data
          git add -- public/integrations/v1/entities.json
          if git diff --cached --quiet; then exit 0; fi
          test "$(git diff --cached --name-only)" = public/integrations/v1/entities.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: publish Atlas integration index'
          # Never force, rebase, or overwrite a concurrent catalog publication.
          git push origin HEAD:main
