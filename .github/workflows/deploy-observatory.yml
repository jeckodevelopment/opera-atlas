name: Publish Opera+ Observatory
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'observatory/**'
      - 'scripts/deploy_observatory_sftp.py'
      - '.github/workflows/deploy-observatory.yml'
permissions:
  contents: read
concurrency:
  group: opera-plus-observatory-sftp
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: opera-plus-atlas
      url: https://opera.plus/osservatorio
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build canonical feed locally for preflight
        run: |
          python -m scripts.build_verified_catalog
          python -m scripts.publish_catalog_v2
          python -m scripts.publish_work_editorial
          python -m scripts.publish_venue_directory
          python -m scripts.publish_programs
          python -m scripts.publish_work_posters
      - name: Syntax and publication boundary checks
        run: |
          node --check observatory/app.js
          node --check observatory/report-pdf.js
          node tests/observatory_pdf_smoke.cjs
          python -m py_compile scripts/deploy_observatory_sftp.py
          python -m unittest discover -s tests -v
      - name: Install SFTP transport
        run: python -m pip install 'paramiko>=3.4,<5'
      - name: Publish standalone Observatory via SFTP
        env:
          ATLAS_SFTP_HOST: ${{ secrets.ATLAS_SFTP_HOST }}
          ATLAS_SFTP_USERNAME: ${{ secrets.ATLAS_SFTP_USERNAME }}
          ATLAS_SFTP_REMOTE_DIR: ${{ secrets.ATLAS_SFTP_REMOTE_DIR }}
          ATLAS_SFTP_PASSWORD: ${{ secrets.ATLAS_SFTP_PASSWORD }}
          ATLAS_SFTP_PRIVATE_KEY: ${{ secrets.ATLAS_SFTP_PRIVATE_KEY }}
          ATLAS_SFTP_KEY_PASSPHRASE: ${{ secrets.ATLAS_SFTP_KEY_PASSPHRASE }}
          ATLAS_SFTP_KNOWN_HOSTS: ${{ secrets.ATLAS_SFTP_KNOWN_HOSTS }}
        run: python -m scripts.deploy_observatory_sftp
