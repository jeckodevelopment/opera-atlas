name: Publish Opera Atlas to opera.plus/atlas
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/*.html'
      - 'site/*.js'
      - 'site/*.css'
      - 'site/*.svg'
      - 'site/.htaccess'
      - 'scripts/deploy_atlas.py'
      - '.github/workflows/deploy-atlas.yml'
permissions:
  contents: read
concurrency:
  group: opera-atlas-sftp-production
  cancel-in-progress: false
jobs:
  publish:
    # Explicitly enable automatic deployment after setting up the new hosting.
    # Manual workflow_dispatch is always available for the first controlled release.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.ATLAS_DEPLOY_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: opera-plus-atlas
      url: https://opera.plus/atlas/
    steps:
      - name: Checkout Opera Atlas
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Verify canonical routes and app
        run: |
          python -m unittest discover -s tests -v
          python -m scripts.publish_catalog_v2 --check
          python -m scripts.publish_work_editorial --check
      - name: Publish owned /atlas folder and verify HTTPS (rollback on error)
        env:
          ATLAS_FTPS_HOST: ${{ secrets.ATLAS_FTPS_HOST }}
          ATLAS_FTPS_PORT: ${{ secrets.ATLAS_FTPS_PORT }}
          ATLAS_FTPS_USERNAME: ${{ secrets.ATLAS_FTPS_USERNAME }}
          ATLAS_FTPS_REMOTE_DIR: ${{ secrets.ATLAS_FTPS_REMOTE_DIR }}
          ATLAS_FTPS_PASSWORD: ${{ secrets.ATLAS_FTPS_PASSWORD }}
        run: timeout --signal=TERM --kill-after=90s 11m python -u scripts/deploy_atlas.py
