name: Publish Opera Atlas to opera.plus/atlas
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'site/*.html'
      - 'site/*.js'
      - 'site/*.css'
      - 'site/*.svg'
      - 'site/.htaccess'
      # Tests run independently in CI. Test-only changes do not alter the
      # static frontend and must not initiate an unrelated SFTP deployment.
      # A failed release can be retried via workflow_dispatch.
      - 'scripts/deploy_atlas.py'
      - 'scripts/deploy_atlas_simple_ftp.py'
      - 'scripts/deploy_atlas_sftp.py'
      - '.github/workflows/deploy-atlas.yml'
permissions:
  contents: read
concurrency:
  group: opera-atlas-ftp-production
  cancel-in-progress: false
jobs:
  publish:
    # Publish frontend changes to production automatically after each main merge.
    # The job runs the entire test suite before any SFTP connection is opened.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: opera-plus-atlas
      url: https://opera.plus/atlas/
    steps:
      - name: Checkout Opera Atlas
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      # The frontend is deployed independently of the daily JSON refresh.
      # Its checkout may contain old content-addressed feeds immediately
      # after a canonical venue/work edit: generate deterministic local files
      # before checking them, without pushing or uploading them over SFTP.
      - name: Build current canonical feed for preflight
        run: |
          python -m scripts.build_verified_catalog
          python -m scripts.publish_catalog_v2
          python -m scripts.publish_work_editorial
          python -m scripts.publish_venue_directory
          # A separately acquired multi-work ticket may precede the public
          # companion JSON. Rebuild it before client and feed tests, without
          # uploading generated catalog data through the frontend publisher.
          python -m scripts.publish_programs
          # Reserved program-component works may have new authentic artwork
          # before the previously committed public poster feed is rebuilt.
          python -m scripts.publish_work_posters
      - name: Verify canonical routes and app
        run: |
          python -m unittest discover -s tests -v
          python -m scripts.build_verified_catalog --check
          python -m scripts.publish_catalog_v2 --check
          python -m scripts.publish_work_editorial --check
          python -m scripts.publish_venue_directory --check
          python -m scripts.publish_programs --check
          python -m scripts.publish_work_posters --check
      - name: Install SFTP transport
        run: python -m pip install 'paramiko>=3.4,<5'
      - name: Upload Atlas static files via SFTP port 22 (OVH)
        env:
          ATLAS_SFTP_HOST: ${{ secrets.ATLAS_SFTP_HOST }}
          ATLAS_SFTP_USERNAME: ${{ secrets.ATLAS_SFTP_USERNAME }}
          ATLAS_SFTP_REMOTE_DIR: ${{ secrets.ATLAS_SFTP_REMOTE_DIR }}
          ATLAS_SFTP_PASSWORD: ${{ secrets.ATLAS_SFTP_PASSWORD }}
          ATLAS_SFTP_PRIVATE_KEY: ${{ secrets.ATLAS_SFTP_PRIVATE_KEY }}
          ATLAS_SFTP_KEY_PASSPHRASE: ${{ secrets.ATLAS_SFTP_KEY_PASSPHRASE }}
          ATLAS_SFTP_KNOWN_HOSTS: ${{ secrets.ATLAS_SFTP_KNOWN_HOSTS }}
        run: timeout --signal=TERM --kill-after=90s 11m python -u -m scripts.deploy_atlas_sftp
