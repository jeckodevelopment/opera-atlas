name: Refresh Opera Atlas source health
run-name: Source health · ${{ github.event_name }} · ${{ github.ref_name }}
on:
  workflow_dispatch:
  repository_dispatch:
    types: [source-health-checkpoint-retry]
  schedule:
    # Independently refresh diagnostics without waiting for the slower catalog.
    - cron: '11 */3 * * *'
  push:
    branches: [main]
    paths:
      - 'data/season-index-config.json'
      - 'scripts/discover_season_indexes.py'
      # Changes to shared robots/HTTP policy must recheck all source statuses.
      - 'opera_atlas/controlled_fetch.py'
      # Source-specific adapters must also retrigger their health scans.
      - 'opera_atlas/rovigo_opera_parser.py'
      - 'opera_atlas/modena_opera_parser.py'
      - 'opera_atlas/napoli_san_carlo.py'
      - 'opera_atlas/mantova_sociale_opera.py'
      - 'opera_atlas/cosenza_rendano_opera.py'
      - 'opera_atlas/vicenza_olimpico_opera.py'
      - 'opera_atlas/pesaro_rof.py'
      - 'opera_atlas/martina_valle_itria.py'
      - 'opera_atlas/trapani_luglio_opera.py'
      - 'scripts/source_automation.py'
      - 'scripts/season_lifecycle_health.py'
      - 'data/season-lifecycle-policy.json'
      - '.github/workflows/refresh-source-health.yml'
permissions:
  contents: write
concurrency:
  # Do not share the slow catalog's opera-atlas-public-feed lock.
  group: opera-atlas-source-health
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout latest approved source configuration
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Check source configuration and diagnostics invariants
        run: |
          python -m unittest tests.test_source_automation tests.test_national_season_indexes tests.test_source_health_dispatch tests.test_season_lifecycle_health -v
      - name: Scan approved official season indexes
        run: |
          python -m scripts.discover_season_indexes --allow-network
          python -m scripts.source_automation
          python -m scripts.source_automation --check
          python -m scripts.season_lifecycle_health
          python -m scripts.season_lifecycle_health --check
          python -c 'import json; p=json.load(open("data/season-index-health.json")); print("Source-health scan:",p.get("checked_at"),"sources:",len(p.get("sources",[])),"verified:",sum(s.get("current_scan_verified",False) for s in p.get("sources",[])))'
      - name: Detect new official candidate URLs
        id: new_candidates
        run: |
          git show HEAD:data/season-index-candidates.json > /tmp/source-candidates-before.json
          python -m scripts.source_health_dispatch \
            --before /tmp/source-candidates-before.json \
            --after data/season-index-candidates.json \
            --github-output "$GITHUB_OUTPUT"
      - name: Persist fresh health and review-only candidate links
        id: checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/season-index-health.json
          git add data/season-index-candidates.json public/catalog/season-index-candidates.json
          git add public/catalog/source-automation.json public/catalog/season-lifecycle.json
          if git diff --cached --quiet; then
            echo "No changes to source health or candidate links."
          else
            git commit -m "data(sources): refresh official source health [skip ci]"
            python -m scripts.safe_push_catalog --source-health
          fi
      - name: Rescan on latest main if checkpoint was deferred
        id: retry
        if: steps.checkpoint.outputs.deferred == 'true'
        run: |
          echo "published=false" >> "$GITHUB_OUTPUT"
          echo "new_candidates=false" >> "$GITHUB_OUTPUT"
          for attempt in 1 2; do
            git fetch --quiet origin main
            git reset --hard origin/main
            git show HEAD:data/season-index-candidates.json > /tmp/source-candidates-retry-before.json
            python -m scripts.discover_season_indexes --allow-network
            python -m scripts.source_automation
            python -m scripts.source_automation --check
            python -m scripts.season_lifecycle_health
            python -m scripts.season_lifecycle_health --check
            : > /tmp/source-health-retry-candidates
            : > /tmp/source-health-retry-push
            python -m scripts.source_health_dispatch \
              --before /tmp/source-candidates-retry-before.json \
              --after data/season-index-candidates.json \
              --github-output /tmp/source-health-retry-candidates
            git add data/season-index-health.json
            git add data/season-index-candidates.json public/catalog/season-index-candidates.json
            git add public/catalog/source-automation.json public/catalog/season-lifecycle.json
            if git diff --cached --quiet; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              break
            fi
            git commit -m "data(sources): retry source health on latest main [skip ci]"
            GITHUB_OUTPUT=/tmp/source-health-retry-push python -m scripts.safe_push_catalog --source-health
            if grep -q '^deferred=false$' /tmp/source-health-retry-push; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              if grep -q '^new_candidates=true$' /tmp/source-health-retry-candidates; then
                echo "new_candidates=true" >> "$GITHUB_OUTPUT"
              fi
              break
            fi
            echo "::warning::Concurrent main update during source-health retry $attempt."
          done
      # A failed save must not drop a scan silently or require a human rerun.
      # Dispatch at most one additional fresh run after contention; the retry
      # starts from latest main, never from the discarded local commit.
      - name: Queue one clean source-health scan after checkpoint contention
        if: steps.retry.outcome == 'success' && steps.retry.outputs.published != 'true' && github.event_name != 'repository_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::warning::Source checkpoint still deferred; dispatching one clean follow-up scan."
          gh api -X POST "repos/${{ github.repository }}/dispatches" \
            -f event_type=source-health-checkpoint-retry

      - name: Fail if fresh source health could not be persisted
        if: steps.retry.outcome == 'success' && steps.retry.outputs.published != 'true'
        run: |
          echo "::error::Fresh source health could not be persisted after bounded retries."
          exit 1
      - name: Trigger central catalog acquisition for newly discovered candidates
        if: (steps.new_candidates.outputs.new_candidates == 'true' && steps.checkpoint.outputs.deferred != 'true') || (steps.retry.outputs.published == 'true' && steps.retry.outputs.new_candidates == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The source-health checkpoint uses [skip ci] and GITHUB_TOKEN pushes
          # do not trigger push workflows. Dispatch the existing catalog event,
          # with the catalog's separate concurrency lock, only for new URLs.
          git fetch --quiet origin main
          git show origin/main:data/season-index-candidates.json > /tmp/source-candidates-published.json
          if python -c 'import json,sys; from scripts.source_health_dispatch import newly_actionable; a=json.load(open(sys.argv[1])); b=json.load(open(sys.argv[2])); sys.exit(0 if newly_actionable(a,b) else 1)' /tmp/source-candidates-before.json /tmp/source-candidates-published.json; then
            gh api -X POST "repos/${{ github.repository }}/dispatches" -f event_type=catalog-refresh-retry
            # The separate fast detail workflow must not wait for its 3-hour
            # cron after the verified new candidate checkpoint. Its own
            # concurrency group protects overlapping dispatches.
            gh api -X POST "repos/${{ github.repository }}/dispatches" \
              -f event_type=new-official-candidates
          else
            echo "New candidates not present on origin/main; catalog dispatch deferred."
          fi
