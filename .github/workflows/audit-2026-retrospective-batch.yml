name: 2026 retrospective archives — national batch

on:
  pull_request:
    paths:
      - 'scripts/audit_2026_retrospective_batch.py'
      - 'tests/test_audit_2026_retrospective_batch.py'
      - '.github/workflows/audit-2026-retrospective-batch.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/audit_2026_retrospective_batch.py'
      - '.github/workflows/audit-2026-retrospective-batch.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opera-atlas-2026-retrospective-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Offline archive discovery tests
        run: python -m unittest tests.test_audit_2026_retrospective_batch -v

  scan:
    needs: tests
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Discover official 2025/26 archives in bulk
        run: |
          python -m scripts.audit_2026_retrospective_batch --allow-network --workers 5 --max-detail-pages 750 --output public/diagnostics/atlas-2026-retrospective-batch.json
      - name: Assert independent no-publication artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('public/diagnostics/atlas-2026-retrospective-batch.json').read_text())
          assert d['read_only'] is True and d['catalog_updated'] is False
          assert d['complete_seasons_certified'] == 0 and d['year'] == 2026
          assert len(d['venues']) > 0
          assert all(v['complete_2026_calendar_verified'] is False for v in d['venues'])
          print('Historical archives scanned:',d['historical_archives_scanned'])
          print('Candidate details scanned:',d['detail_pages_scanned'])
          print('Unverified event facts:',len(d['unverified_2026_facts']))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opera-atlas-2026-retrospective-batch
          path: public/diagnostics/atlas-2026-retrospective-batch.json
          retention-days: 30

  publish:
    needs: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093a # v4
        with:
          name: opera-atlas-2026-retrospective-batch
          path: public/diagnostics
      - name: Publish only retrospective diagnostics on latest main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp public/diagnostics/atlas-2026-retrospective-batch.json /tmp/atlas-2026-retrospective-batch.json
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin main
            git checkout -B publish-2026-retrospective FETCH_HEAD
            mkdir -p public/diagnostics
            cp /tmp/atlas-2026-retrospective-batch.json public/diagnostics/atlas-2026-retrospective-batch.json
            git add -- public/diagnostics/atlas-2026-retrospective-batch.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(audit): 2026 retrospective archive diagnostics [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
