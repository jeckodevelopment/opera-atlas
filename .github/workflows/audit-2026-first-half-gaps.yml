name: Audit 2026 first half verified official gaps

on:
  pull_request:
    paths:
      - 'scripts/audit_2026_first_half_verified_gaps.py'
      - 'tests/test_audit_2026_first_half_verified_gaps.py'
      - '.github/workflows/audit-2026-first-half-gaps.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/audit_2026_first_half_verified_gaps.py'
      - '.github/workflows/audit-2026-first-half-gaps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test and reconcile reviewed Jan-Jun official recite
        run: |
          python -m unittest tests.test_audit_2026_first_half_verified_gaps -v
          python -m scripts.audit_2026_first_half_verified_gaps
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('public/diagnostics/atlas-2026-first-half-verified-gaps.json').read_text())
          assert x['read_only'] is True and x['catalog_updated'] is False
          assert x['complete_seasons_certified'] == 0
          assert x['reviewed_official_performances'] == sum(x['official_match_counts'].values())
          assert x['reviewed_official_performances'] >= 25
          assert x['official_match_counts'].get('verified_official_recita_absent_from_catalog',0) >= 6
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opera-atlas-2026-first-half-verified-gaps
          path: public/diagnostics/atlas-2026-first-half-verified-gaps.json
          retention-days: 30

  publish:
    needs: audit
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093a # v4
        with:
          name: opera-atlas-2026-first-half-verified-gaps
          path: public/diagnostics
      - name: Publish diagnostic only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp public/diagnostics/atlas-2026-first-half-verified-gaps.json /tmp/atlas-2026-first-half-verified-gaps.json
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin main
            git checkout -B publish-2026-first-half-gaps FETCH_HEAD
            mkdir -p public/diagnostics
            cp /tmp/atlas-2026-first-half-verified-gaps.json public/diagnostics/atlas-2026-first-half-verified-gaps.json
            git add -- public/diagnostics/atlas-2026-first-half-verified-gaps.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(audit): first-half 2026 official recite gaps [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
