name: Refresh public Opera Atlas catalog
# Keep network-acquisition runs distinguishable from the Python-only CI.
# Manual end-to-end validation trigger for checkpoint recovery (#738), 2026-11-23.
run-name: Catalog acquisition · ${{ github.event_name }} · ${{ github.ref_name }}
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [catalog-refresh-retry]
  # Operator-requested recovery refresh: verify Genova, Bergamo and Brescia live.
  push:
    branches: [main]
    paths:
      # Every adapter/parser change must validate and refresh the public feed,
      # not merely pass the separate Python test workflow.
      - 'opera_atlas/**'
      - 'scripts/**'
      # Observability and browser-audit helpers do not change the canonical
      # source facts or the catalog. They must not start a long acquisition.
      - '!scripts/prerender_atlas.py'
      - '!scripts/atlas_seo.py'
      - '!scripts/deploy_atlas.py'
      - '!scripts/deploy_atlas_sftp.py'
      - '!scripts/deploy_atlas_simple_ftp.py'
      - '!scripts/pipeline_operations_health.py'
      - '!scripts/push_pipeline_operations_health.py'
      - '!scripts/audit_public_atlas.py'
      - '!scripts/push_live_publication_audit.py'
      # Tests still run on every PR in python-tests.yml; running a full
      # network crawl for arbitrary test edits creates dozens of redundant
      # queued jobs. Explicitly retained tests below are acquisition-critical.
      - 'data/identity-registry.json'
      - 'data/venue-directory.json'
      - 'data/verified-launch-catalog.json'
      - 'data/daily-source-config.json'
      - 'data/season-index-config.json'
      - 'scripts/discover_season_indexes.py'
      - 'scripts/rollover_season_indexes.py'
      - 'scripts/season_lifecycle_health.py'
      - 'data/season-lifecycle-policy.json'
      - 'tests/test_season_rollover.py'
      - 'data/corroborated-performance-config.json'
      - 'scripts/corroborate_performances.py'
      - 'tests/test_corrob_performances.py'
      - 'data/reviewed-performance-decisions.json'
      - 'data/rovigo-reviewed-additional-productions.json'
      - 'scripts/apply_rovigo_additional_reviewed.py'
      - 'scripts/apply_reviewed_performance_evidence.py'
      - 'scripts/collect_candidate_details.py'
      - 'scripts/auto_work_research.py'
      - 'tests/test_auto_work_research.py'
      - 'tests/test_new_opera_autopromotion.py'
      - 'scripts/auto_catalogue.py'
      - 'tests/test_auto_catalogue.py'
      # Changes to the festival's state-independent promotion gates must be
      # verified by a real refresh, not just the isolated Python CI.
      - 'tests/test_festival_verdi_rolling.py'
      - 'data/auto-source-urls.json'
      - 'tests/test_candidate_detail_evidence.py'
      - 'tests/test_national_season_indexes.py'
      - 'data/verified-time-evidence.json'
      # Complete authoritative editorial records must publish without
      # requiring an unrelated parser or test change in the same PR.
      - 'data/verified-work-authority-seeds.json'
      - 'data/verified-work-editorial-attribution.json'
      - 'site/work-synopses.json'
      - 'site/work-history.json'
      - 'data/archival-work-images.json'
      - 'scripts/publish_work_editorial.py'
      - 'opera_atlas/programs.py'
      - 'scripts/publish_programs.py'
      - 'public/catalog/programs.json'
      - 'tests/test_multi_work_publication.py'
      - 'scripts/editorial_review_queue.py'
      - 'tests/test_editorial_review_queue.py'
      - 'tests/test_work_editorial_feed.py'
      - 'scripts/daily_ingest.py'
      - 'scripts/discovery_queue.py'
      - 'tests/test_discovery_queue.py'
      - 'scripts/source_coverage.py'
      - 'scripts/sync_source_registry.py'
      - 'tests/test_source_registry_sync.py'
      - 'tests/test_source_coverage.py'
      - 'scripts/build_verified_catalog.py'
      - 'scripts/publish_catalog_v2.py'
      - 'scripts/source_coverage.py'
      - 'data/sources.json'
      - '.github/workflows/refresh-catalog.yml'
      # Keep the retrospective read-only diagnostic pipeline out of the
      # national source crawl, even when its own trigger filter changes.
      # These exclusions deliberately follow the broad scripts/** inclusion.
      - '!scripts/audit_recite_2026.py'
      - '!scripts/audit_2026_sources.py'
      - '!scripts/audit_2026_mass_scan.py'
      - '!scripts/audit_2026_mass_reconciliation.py'
      - '!scripts/audit_2026_retrospective_batch.py'
      - '!scripts/audit_2026_retrospective_reconciliation.py'
      - '!scripts/audit_2026_jan_jun_official.py'
      - '!scripts/audit_2026_jan_jun_reconciliation.py'
      - '!.github/workflows/refresh-catalog.yml'
permissions:
  contents: write
concurrency:
  group: opera-atlas-public-feed
  # Don't interrupt an expensive approved crawl for each new PR merge.
  # Stale outputs remain protected by safe-push and automatic retry.
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    outputs:
      recovery_required: ${{ steps.early_national_checkpoint.outputs.deferred == 'true' || steps.cached_publication.outputs.deferred == 'true' || steps.roma_checkpoint.outputs.deferred == 'true' || steps.early_season_checkpoint.outputs.deferred == 'true' || steps.source_checkpoint.outputs.deferred == 'true' || steps.publish_catalog.outputs.deferred == 'true' }}
    steps:
      - name: Checkout canonical data
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate current public catalog before acquisition
        run: |
          # Regenerate the deterministic composite-ticket companion before
          # comparing it with newly checkpointed source-bound evidence.
          # The immutable source registry may be ahead of the derived
          # content-addressed public channels after an approved PR merge.
          # Regenerate the dependent feeds before asserting consistency.
          python -m scripts.build_verified_catalog
          python -m scripts.publish_catalog_v2
          python -m scripts.publish_work_editorial
          python -m scripts.publish_programs
          python -m scripts.publish_work_posters
          # Reconcile the identity report against the just regenerated
          # canonical registry, not an outdated snapshot from a prior run.
          python -m scripts.work_identity_review
          python -m unittest discover -s tests -v
          python -m scripts.build_verified_catalog --check
          python -m scripts.publish_catalog_v2 --check
          # Changes to approved source and genre rules legitimately alter
          # cached candidate classifications. Reconcile locally before the
          # strict consistency check, then publish both derived queues in
          # the existing atomic catalog checkpoint later in this workflow.
          python -m scripts.reconcile_published_candidates
          python -m scripts.reconcile_work_intelligence_health
          python -m scripts.reconcile_published_candidates --check
          python -m scripts.publish_work_editorial --check
          # A newly-reviewed observation may legitimately differ from the previous public v2 snapshot.
          # Validate the regenerated manifest only after rebuilding all referenced channels.
      # Corroborated cross-source evidence is a source-neutral candidate
      # input: issuer repertoire + independently checked external showtimes.
      # It never bypasses the canonical candidate publisher or robots gates.
      - name: Collect San Carlo secondary candidates before national backlog
        id: san_carlo_candidates
        # Optional external source: never block the entire national catalog
        # when an independent calendar is temporarily inaccessible.
        continue-on-error: true
        run: python -m scripts.scan_san_carlo_secondary --allow-network --sync-candidates
      - name: Cross-check San Carlo recite against independent calendar
        id: san_carlo_comparison
        # Do not compare an old checkpoint after a failed fresh acquisition.
        if: steps.san_carlo_candidates.outcome == 'success'
        continue-on-error: true
        run: python -m scripts.corroborate_san_carlo_secondary --allow-network --sync-review
      - name: Acquire cross-source corroboration before national backlog
        run: python -m scripts.corroborate_performances
      # An exact, first-party Rovigo detail URL is available even when the
      # obsolete 2026/27 season slider fails. Discover it before the national
      # queue so source discovery, detail evidence and canonical publication
      # can complete in the same early checkpoint. All requests use robots.
      - name: Acquire first-party Rovigo Traviata before national backlog
        run: |
          python -m scripts.discover_season_indexes --allow-network --source-key rovigo-sociale-opera-2026-27
          python -m scripts.collect_candidate_details --allow-network --source-key rovigo-sociale-opera-2026-27
      # Take a national checkpoint before the expensive source crawl. This
      # recovers the existing review backlog even if a later adapter or
      # knowledge-service step times out. Each detail fetch respects robots.
      - name: Acquire pending official detail pages before slow discovery
        run: python -m scripts.collect_candidate_details --allow-network
      # This editor-approved, source-labelled record is kept in stable
      # configuration, not merged into high-churn generated JSON by a PR.
      # Apply it only after attempting stronger live first-party evidence;
      # the central canonical reconciler still owns all publication.
      - name: Apply reviewed cross-source facts to latest candidate registry
        run: python -m scripts.apply_reviewed_performance_evidence
      - name: Apply reviewed Aida and Cenerentola to the central candidate registry
        run: python -m scripts.apply_rovigo_additional_reviewed
      - name: Route fully corroborated San Carlo recite into canonical review queue
        if: steps.san_carlo_candidates.outcome == 'success' && steps.san_carlo_comparison.outcome == 'success'
        # External-source review is optional, never block the national feed.
        continue-on-error: true
        run: python -m scripts.apply_san_carlo_corroborated
      - name: Build identity-review snapshot from official candidate evidence
        run: python -m scripts.work_identity_review
      - name: Checkpoint national pending-candidate evidence and diagnostics
        id: early_national_checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidate-detail-evidence.json data/candidate-detail-health.json public/catalog/candidate-detail-evidence.json public/catalog/work-identity-review.json
          # Preserve the cross-source gate outcome even when no recita passed.
          git add data/corroborated-performance-health.json
          if [ -f data/san-carlo-canonical-review-health.json ]; then git add data/san-carlo-canonical-review-health.json; fi
          for f in data/san-carlo-secondary-candidates.json data/san-carlo-secondary-health.json public/catalog/san-carlo-secondary-candidates.json data/san-carlo-secondary-corroboration.json public/catalog/san-carlo-secondary-corroboration.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          git add data/season-index-candidates.json data/season-index-health.json public/catalog/season-index-candidates.json
          if git diff --cached --quiet; then
            echo "deferred=false" >> "$GITHUB_OUTPUT"
            echo "No new official detail evidence in early national checkpoint."
          else
            git commit -m "data(sources): checkpoint national candidate detail evidence early [skip ci]"
            python -m scripts.safe_push_catalog
          fi
      - name: Early publish previously verified known-opera recite
        run: |
          # No network access and no new work identities here: only already
          # fetched composer/title/venue/time evidence verified by Atlas.
          python -m scripts.repair_petruzzelli_mixed_program
          python -m scripts.publish_cached_known
          # Immediately publish completed candidate evidence, independently of
          # the slower national discovery crawl. Uses no new network requests.
          python -m scripts.auto_catalogue
          python -m scripts.publish_work_posters
          python -m scripts.publish_programs
          # A cached new opera may be published before the slow discovery
          # phase. Close its candidate in the SAME early checkpoint.
          python -m scripts.reconcile_published_candidates
          python -m scripts.reconcile_work_intelligence_health
          python -m scripts.work_identity_review
          python -m scripts.build_verified_catalog
          python -m scripts.publish_catalog_v2
          python -m scripts.publish_work_editorial
          python -m scripts.editorial_review_queue
          python -m scripts.publish_venue_directory
          # Verified performance venues may precede optional editorial profiles.
          python -m scripts.venue_editorial_review_queue
          python -m scripts.sync_source_registry
          python -m scripts.source_coverage
          python -m scripts.recite_coverage
          python -m scripts.source_automation
          python -m scripts.catalogation_diagnostics
          python -m scripts.candidate_publication_evidence
          python -m scripts.build_verified_catalog --check
          python -m scripts.publish_catalog_v2 --check
          python -m scripts.publish_work_editorial --check
          python -m scripts.publish_programs --check
          python -m scripts.editorial_review_queue --check
      - name: Publish cached recite before slow source scans
        id: cached_publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/verified-launch-catalog.json data/identity-registry.json data/auto-source-urls.json data/verified-time-evidence.json site/work-synopses.json site/work-history.json site/performances.json public/catalog/v2/ public/catalog/work-editorial.json public/catalog/coverage.json public/catalog/recite-coverage.json public/catalog/source-automation.json public/catalog/catalogation-diagnostics.json public/catalog/candidate-publication-evidence.json public/catalog/venue-directory.json
          git add data/work-poster-evidence.json data/work-poster-health.json public/catalog/work-posters.json data/autonomous-catalogue-health.json public/catalog/programs.json
          git add data/season-index-candidates.json public/catalog/season-index-candidates.json data/candidate-reconciliation-health.json
          if git diff --cached --quiet; then
            echo "deferred=false" >> "$GITHUB_OUTPUT"
            echo "No new cached verified facts to publish."
          else
            git commit -m "data(catalog): publish cached verified recite [skip ci]"
            python -m scripts.safe_push_catalog
          fi
      - name: Queue reliable publication notifications after cached checkpoint
        if: steps.cached_publication.outputs.deferred != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/dispatches" -f event_type=atlas-notification-reconcile
      - name: Reconcile pending Roma official detail pages ahead of slow crawl
        run: |
          python -m scripts.collect_candidate_details --allow-network --source-key opera-roma-season-2026-27
          python -m scripts.reconcile_published_candidates
          python -m scripts.reconcile_work_intelligence_health
      - name: Checkpoint first-party Roma candidate classifications
        id: roma_checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m scripts.work_identity_review
          git add public/catalog/work-identity-review.json data/candidate-detail-evidence.json data/candidate-detail-health-partial.json public/catalog/candidate-detail-evidence.json data/season-index-candidates.json public/catalog/season-index-candidates.json data/candidate-reconciliation-health.json
          if git diff --cached --quiet; then
            echo "deferred=false" >> "$GITHUB_OUTPUT"
            echo "No new Roma evidence to checkpoint."
          else
            git commit -m "data(roma): reconcile official source candidates before full refresh [skip ci]"
            python -m scripts.safe_push_catalog
          fi
      - name: Discover approved season indexes ahead of slow details
        run: |
          python -m scripts.discover_season_indexes --allow-network
          # Index discovery can append candidates or reset provisional
          # states. Reconcile the same registry before any health snapshot
          # is shown in the diagnostics UI.
          python -m scripts.reconcile_published_candidates
          python -m scripts.reconcile_work_intelligence_health
          python -m scripts.source_automation
          python -m scripts.catalogation_diagnostics
          python -m scripts.candidate_publication_evidence
          python -m scripts.source_automation --check
          python -m scripts.catalogation_diagnostics --check
          python -m scripts.candidate_publication_evidence --check
          python -m scripts.season_lifecycle_health
          python -m scripts.season_lifecycle_health --check
      - name: Checkpoint current season-index status and candidate URLs
        id: early_season_checkpoint
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/season-index-health.json data/season-index-candidates.json public/catalog/season-index-candidates.json data/candidate-reconciliation-health.json public/catalog/source-automation.json public/catalog/catalogation-diagnostics.json public/catalog/candidate-publication-evidence.json public/catalog/season-lifecycle.json
          if git diff --cached --quiet; then
            echo "deferred=false" >> "$GITHUB_OUTPUT"
            echo "No new season-index diagnostic or candidates."
          else
            git commit -m "data(sources): checkpoint season index health early [skip ci]"
            python -m scripts.safe_push_catalog
          fi
      - name: Promote already verified cached works before external acquisition
        run: |
          python -m scripts.auto_catalogue
          python -m scripts.publish_work_posters
          python -m scripts.publish_programs
          python -m scripts.reconcile_published_candidates
          python -m scripts.reconcile_work_intelligence_health
          python -m scripts.discovery_queue
          python -m scripts.build_verified_catalog
          python -m scripts.publish_catalog_v2
          python -m scripts.publish_work_editorial
          python -m scripts.publish_venue_directory
          python -m scripts.sync_source_registry
          python -m scripts.source_coverage
          python -m scripts.recite_coverage
          python -m scripts.source_automation
          python -m scripts.catalogation_diagnostics
          python -m scripts.candidate_publication_evidence
          python -m scripts.sync_source_registry --check
          python -m scripts.source_coverage --check
          python -m scripts.recite_coverage --check
          python -m scripts.source_automation --check
          python -m scripts.catalogation_diagnostics --check
          python -m scripts.candidate_publication_evidence --check
          python -m scripts.build_verified_catalog --check
          python -m scripts.publish_catalog_v2 --check
          python -m scripts.publish_work_editorial --check
          python -m scripts.publish_venue_directory --check
          python -m scripts.venue_editorial_review_queue --check
          python -m scripts.publish_work_posters --check
          python -m scripts.publish_programs --check
      - name: Safely checkpoint fully validated early canonical work publication
        id: early_verified_publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/verified-launch-catalog.json data/identity-registry.json data/auto-source-urls.json data/verified-time-evidence.json data/autonomous-catalogue-health.json
          git add data/auto-work-intelligence.json data/auto-work-intelligence-health.json data/candidate-reconciliation-health.json data/season-index-candidates.json public/catalog/season-index-candidates.json
          git add site/work-synopses.json site/work-history.json site/performances.json public/catalog/v2/ public/catalog/work-editorial.json public/catalog/work-posters.json data/work-poster-evidence.json data/work-poster-health.json
          git add public/catalog/programs.json public/catalog/discovery.json data/discovery-candidates.json public/catalog/venue-directory.json
          git add data/sources.json public/catalog/coverage.json public/catalog/recite-coverage.json public/catalog/source-automation.json public/catalog/catalogation-diagnostics.json public/catalog/candidate-publication-evidence.json
          if git diff --cached --quiet; then
            echo "No newly verified works to publish before acquisition."
          else
            git commit -m "data(catalog): publish verified works before external crawl [skip ci]"
            python -m scripts.safe_push_catalog
          fi
      - name: Incrementally scan only explicitly approved official pages
        run: python -m scripts.daily_ingest --allow-network
      - name: Verify and adopt next officially published season indexes
        run: python -m scripts.rollover_season_indexes --allow-network
      - name: Discover production links from approved national season indexes
        run: |
          python -m scripts.discover_season_indexes --allow-network
          python -m scripts.reconcile_published_candidates
          python -m scripts.reconcile_work_intelligence_health
      - name: Refresh lifecycle diagnostics after index rollover
        run: python -m scripts.season_lifecycle_health
      - name: Collect structured facts from bounded discovered detail pages
        run: python -m scripts.collect_candidate_details --allow-network
      - name: Collect exact monthly opera performances in Firenze
        run: python -m scripts.collect_maggio_calendar --allow-network
      - name: Persist source discovery and verified detail evidence early
        id: source_checkpoint
        run: |
          # Source discovery and official details are independently useful
          # even when subsequent authority research or poster enrichment fails.
          # These are REVIEW-ONLY inputs; do not publish unverified recite here.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/season-index-config.json data/season-rollover-health.json data/season-index-candidates.json data/season-index-health.json data/candidate-reconciliation-health.json public/catalog/season-index-candidates.json public/catalog/season-lifecycle.json
          git add data/candidate-detail-evidence.json data/candidate-detail-health.json data/maggio-calendar-health.json public/catalog/candidate-detail-evidence.json data/maggio-calendar-health.json
          if git diff --cached --quiet; then
            echo "deferred=false" >> "$GITHUB_OUTPUT"
            echo "No new official candidate evidence."
          else
            git commit -m "data(sources): checkpoint verified official source evidence [skip ci]"
            python -m scripts.safe_push_catalog
          fi
      - name: Resolve unseen opera identities and prepare verified short introductions
        run: python -m scripts.auto_work_research --allow-network
      - name: Promote fully verified candidate dates without manual reconciliation
        run: python -m scripts.auto_catalogue
      - name: Enrich all newly catalogued operas with official poster images
        run: |
          python -m scripts.publish_work_posters --allow-network
          python -m scripts.publish_programs
      - name: Finalize all candidate outcomes before atomic public catalog publication
        run: |
          python -m scripts.reconcile_published_candidates
          python -m scripts.reconcile_work_intelligence_health
          python -m scripts.work_identity_review
      - name: Persist unrecognized productions in review-only discovery feed
        run: python -m scripts.discovery_queue
      - name: Regenerate and verify editorial snapshot and canonical feed
        run: |
          python -m scripts.build_verified_catalog
          python -m scripts.publish_catalog_v2
          # Reconcile once more against the *final* canonical release, not
          # only the pre-generation staging snapshot. Refresh both audit
          # registries before deriving coverage and publication diagnostics.
          python -m scripts.reconcile_published_candidates
          python -m scripts.reconcile_work_intelligence_health
          python -m scripts.work_identity_review
          python -m scripts.publish_work_editorial
          python -m scripts.publish_venue_directory
          python -m scripts.sync_source_registry
          python -m scripts.source_coverage
          python -m scripts.recite_coverage
          python -m scripts.source_automation
          python -m scripts.catalogation_diagnostics
          python -m scripts.candidate_publication_evidence
          python -m scripts.sync_source_registry --check
          python -m scripts.source_coverage --check
          python -m scripts.recite_coverage --check
          python -m scripts.source_automation --check
          python -m scripts.catalogation_diagnostics --check
          python -m scripts.candidate_publication_evidence --check
          python -m scripts.build_verified_catalog --check
          python -m scripts.publish_catalog_v2 --check
          python -m scripts.publish_work_editorial --check
          python -m scripts.publish_venue_directory --check
          python -m scripts.publish_work_posters --check
          python -m scripts.publish_programs --check
          python -m unittest discover -s tests -v
      # Read-only diagnostics also run when an earlier acquisition or final
      # validation step fails; no candidate is promoted by this report.
      - name: Explain unresolved candidate blockers even after failure
        if: ${{ always() }}
        run: python -m scripts.candidate_blocker_report
      - name: Publish only changed validated data (no SFTP)
        id: publish_catalog
        run: |
          echo "baseline=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/editorial-review-queue.json data/venue-editorial-review-queue.json public/catalog/work-identity-review.json
          git add public/catalog/programs.json public/catalog/venue-directory.json data/work-poster-evidence.json data/work-poster-health.json public/catalog/work-posters.json data/candidate-reconciliation-health.json data/season-index-config.json data/season-rollover-health.json data/sources.json site/work-synopses.json data/auto-work-intelligence.json data/auto-work-intelligence-health.json site/work-history.json public/catalog/v2/ public/catalog/candidate-detail-evidence.json data/candidate-detail-evidence.json data/candidate-detail-health.json data/candidate-detail-health-partial.json data/auto-source-urls.json data/autonomous-catalogue-health.json public/catalog/season-lifecycle.json public/catalog/season-index-candidates.json data/season-index-candidates.json data/season-index-health.json public/catalog/work-editorial.json public/catalog/coverage.json public/catalog/recite-coverage.json public/catalog/source-automation.json public/catalog/catalogation-diagnostics.json public/catalog/candidate-publication-evidence.json public/catalog/discovery.json data/discovery-candidates.json data/verified-launch-catalog.json data/identity-registry.json data/verified-time-evidence.json site/performances.json
          if [ -f data/catalog-source-health.json ]; then git add data/catalog-source-health.json; fi
          if git diff --cached --quiet; then
            echo "No changes in reviewed catalog; no commit or deployment."
            exit 0
          fi
          git commit -m "data(catalog): publish reviewed canonical JSON v2 [skip ci]"
          # Bounded, non-forced push; defer stale data if main received a
          # newer adapter or canonical update while the scan was running.
          python -m scripts.safe_push_catalog
      - name: Queue reliable publication notifications after final checkpoint
        if: steps.publish_catalog.outputs.deferred != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/dispatches" -f event_type=atlas-notification-reconcile
      # Deferred writes are recovered from latest committed data by the
      # checkpoint recovery job below; never queue another full network scan.

  # If a late publication/validation step fails, use source checkpoints that
  # were already committed by the acquisition job. This job never crawls.
  recover_from_checkpoint:
    needs: update
    if: ${{ always() && (needs.update.result == 'failure' || needs.update.outputs.recovery_required == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest committed source checkpoints
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Rebuild and validate canonical feed without network access
        run: |
          python -m scripts.reconcile_published_candidates
          python -m scripts.reconcile_work_intelligence_health
          python -m scripts.work_identity_review
          python -m scripts.auto_catalogue
          python -m scripts.publish_work_posters
          python -m scripts.publish_programs
          python -m scripts.build_verified_catalog
          python -m scripts.publish_catalog_v2
          python -m scripts.reconcile_published_candidates
          python -m scripts.reconcile_work_intelligence_health
          python -m scripts.work_identity_review
          python -m scripts.publish_work_editorial
          python -m scripts.publish_venue_directory
          python -m scripts.sync_source_registry
          python -m scripts.source_coverage
          python -m scripts.recite_coverage
          python -m scripts.source_automation
          python -m scripts.catalogation_diagnostics
          python -m scripts.candidate_publication_evidence
          python -m scripts.discovery_queue
          python -m scripts.editorial_review_queue
          python -m scripts.venue_editorial_review_queue
          python -m scripts.build_verified_catalog --check
          python -m scripts.publish_catalog_v2 --check
          python -m scripts.publish_work_editorial --check
          python -m scripts.publish_venue_directory --check
          python -m scripts.publish_work_posters --check
          python -m scripts.publish_programs --check
          python -m unittest discover -s tests -v
      - name: Explain checkpoint candidate blockers even after failure
        if: ${{ always() }}
        run: python -m scripts.candidate_blocker_report
      - name: Commit only verified checkpoint-derived catalog changes
        id: recovered_publication
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only existing tracked outputs are staged, never unverified source
          # observations from the failed run or arbitrary scratch artifacts.
          git add -u data/ site/ public/catalog/
          if git diff --cached --quiet; then
            echo "No verified catalog changes to recover."
          else
            git commit -m "data(catalog): recover verified feed from committed checkpoint [skip ci]"
            python -m scripts.safe_push_catalog
          fi
      - name: Notify publication reconciliation after successful recovery
        if: steps.recovered_publication.outputs.deferred != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/dispatches" -f event_type=atlas-notification-reconcile
