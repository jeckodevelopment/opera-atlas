name: Refresh public Opera Atlas catalog
on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/identity-registry.json'
      - 'data/verified-launch-catalog.json'
      - 'data/daily-source-config.json'
      - 'data/verified-time-evidence.json'
      - 'site/work-synopses.json'
      - 'scripts/publish_work_editorial.py'
      - 'tests/test_work_editorial_feed.py'
      - 'scripts/daily_ingest.py'
      - 'scripts/discovery_queue.py'
      - 'tests/test_discovery_queue.py'
      - 'scripts/source_coverage.py'
      - 'tests/test_source_coverage.py'
      - 'scripts/build_verified_catalog.py'
      - 'scripts/publish_catalog_v2.py'
      - 'scripts/source_coverage.py'
      - 'data/sources.json'
      - '.github/workflows/refresh-catalog.yml'
permissions:
  contents: write
concurrency:
  group: opera-atlas-public-feed
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout canonical data
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate current public catalog before acquisition
        run: |
          python -m unittest discover -s tests -v
          python -m scripts.build_verified_catalog --check
          # A newly-reviewed observation may legitimately differ from the previous public v2 snapshot.
          # Validate the regenerated manifest only after rebuilding all referenced channels.
      - name: Incrementally scan only explicitly approved official pages
        run: python -m scripts.daily_ingest --allow-network
      - name: Persist unrecognized productions in review-only discovery feed
        run: python -m scripts.discovery_queue
      - name: Regenerate and verify editorial snapshot and canonical feed
        run: |
          python -m scripts.build_verified_catalog
          python -m scripts.publish_catalog_v2
          python -m scripts.publish_work_editorial
          python -m scripts.source_coverage
          python -m scripts.source_coverage --check
          python -m scripts.build_verified_catalog --check
          python -m scripts.publish_catalog_v2 --check
          python -m scripts.publish_work_editorial --check
          python -m unittest discover -s tests -v
      - name: Publish only changed validated data (no SFTP)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/catalog/v2/ public/catalog/work-editorial.json public/catalog/coverage.json public/catalog/discovery.json data/discovery-candidates.json data/verified-launch-catalog.json data/identity-registry.json site/performances.json
          if [ -f data/catalog-source-health.json ]; then git add data/catalog-source-health.json; fi
          if git diff --cached --quiet; then
            echo "No changes in reviewed catalog; no commit or deployment."
            exit 0
          fi
          git commit -m "data(catalog): publish reviewed canonical JSON v2 [skip ci]"
          git push origin HEAD:main
