name: Audit 2026 — 72 venues by 12 months

on:
  pull_request:
    paths:
      - 'scripts/audit_2026_venue_month_coverage.py'
      - 'data/official-2026-zero-venue-opera-leads.json'
      - 'tests/test_audit_2026_venue_month_coverage.py'
      - '.github/workflows/audit-2026-venue-month-coverage.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/audit_2026_venue_month_coverage.py'
      - 'data/official-2026-zero-venue-opera-leads.json'
      - '.github/workflows/audit-2026-venue-month-coverage.yml'
  # A GITHUB_TOKEN publication commit does not trigger ordinary push workflows.
  # workflow_run is emitted after the cached public-feed publisher completes,
  # so the coverage diagnostic can be rebuilt from actual published main.
  workflow_run:
    workflows: ["Publish cached verified Opera Atlas recite"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: atlas-2026-national-coverage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  measure:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate monthly national coverage invariants
        run: python -m unittest tests.test_audit_2026_venue_month_coverage -v
      - name: Build exact 2026 official evidence coverage report
        run: |
          python -m scripts.audit_2026_venue_month_coverage
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('public/diagnostics/atlas-2026-venue-month-coverage.json')
          d=json.loads(p.read_text(encoding='utf-8'))
          assert d['cell_count']==864 and d['venue_count']==72
          assert d['read_only'] and not d['catalog_updated']
          assert d['complete_venue_months']==0
          assert all(not row['complete_month_verified'] for row in d['rows'])
          assert d['observed_2026_opera_showtimes']>0
          assert len(d['venue_audit_priorities'])==d['venue_count']
          assert d['zero_published_venue_count']==sum(d['zero_published_by_calendar_status'].values())
          assert d['official_2026_opera_lead_count']==92
          assert d['official_lead_venues_with_zero_published']==12
          assert d['official_unpublished_opera_lead_count']<=92
          assert all(not p['missing_recite_certified'] for p in d['venue_audit_priorities'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atlas-2026-national-72x12-coverage
          path: public/diagnostics/atlas-2026-venue-month-coverage.json
          retention-days: 30

  publish:
    needs: measure
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093a # v4
        with:
          name: atlas-2026-national-72x12-coverage
          path: public/diagnostics
      - name: Publish only versioned diagnostic JSON on latest main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp public/diagnostics/atlas-2026-venue-month-coverage.json /tmp/atlas-2026-venue-month-coverage.json
          # The downloaded artifact dirties the checkout. Restore only this
          # generated diagnostic before switching to the newest main; the
          # verified artifact is safely preserved under /tmp.
          git restore --worktree -- public/diagnostics/atlas-2026-venue-month-coverage.json
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin main
            git checkout -B publish-2026-venue-month FETCH_HEAD
            mkdir -p public/diagnostics
            cp /tmp/atlas-2026-venue-month-coverage.json public/diagnostics/atlas-2026-venue-month-coverage.json
            git add -- public/diagnostics/atlas-2026-venue-month-coverage.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(audit): 2026 venue/month coverage evidence [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
