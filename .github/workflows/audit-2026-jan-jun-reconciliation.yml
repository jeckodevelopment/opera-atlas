name: Audit 2026 H1 — reconcile 93 verified-source observations

on:
  pull_request:
    paths:
      - 'scripts/audit_2026_jan_jun_reconciliation.py'
      - 'tests/test_audit_2026_jan_jun_reconciliation.py'
      - '.github/workflows/audit-2026-jan-jun-reconciliation.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/audit_2026_jan_jun_reconciliation.py'
      - '.github/workflows/audit-2026-jan-jun-reconciliation.yml'
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: opera-atlas-2026-h1-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_audit_2026_jan_jun_reconciliation -v
      - name: Reconcile first-semester showtimes without crawling
        run: |
          python -m scripts.audit_2026_jan_jun_reconciliation
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('public/diagnostics/atlas-2026-jan-jun-reconciliation.json').read_text())
          assert r['read_only'] and r['catalog_updated'] is False
          assert r['complete_seasons_certified']==0
          assert r['source_observations']==93
          assert len(r['monthly_venue_coverage'])==72*6
          print('Evidence review states:',r['status_counts'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opera-atlas-2026-jan-jun-reconciliation
          path: public/diagnostics/atlas-2026-jan-jun-reconciliation.json
          retention-days: 30

  publish:
    needs: review
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093a # v4
        with:
          name: opera-atlas-2026-jan-jun-reconciliation
          path: public/diagnostics
      - name: Publish only retrospective H1 diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp public/diagnostics/atlas-2026-jan-jun-reconciliation.json /tmp/atlas-2026-jan-jun-reconciliation.json
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin main
            git checkout -B publish-2026-h1-review FETCH_HEAD
            mkdir -p public/diagnostics
            cp /tmp/atlas-2026-jan-jun-reconciliation.json public/diagnostics/atlas-2026-jan-jun-reconciliation.json
            git add -- public/diagnostics/atlas-2026-jan-jun-reconciliation.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(audit): 2026 first-half source reconciliation [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
