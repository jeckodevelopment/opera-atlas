name: Publish cached verified Opera Atlas recite
on:
  workflow_dispatch:
  repository_dispatch:
    types: [cached-catalog-retry]
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      # Ignore diagnostics-only edits: no candidate facts or verified recite
      # can be unlocked by modifying these observation helpers.
      - '!scripts/pipeline_operations_health.py'
      - '!scripts/push_pipeline_operations_health.py'
      - '!scripts/audit_public_atlas.py'
      - '!scripts/push_live_publication_audit.py'
      - 'opera_atlas/**'
      - 'data/candidate-detail-evidence.json'
      - 'data/season-index-candidates.json'
      # Complete editorial and archival provenance can now independently
      # unlock verified new-work publication, without a new network crawl.
      - 'data/verified-work-authority-seeds.json'
      - 'data/verified-ticketing-art.json'
      - 'tests/test_work_history.py'
      - 'tests/test_work_posters.py'
      - 'tests/test_ticketing_event_artwork.py'
      - 'data/archival-work-images.json'
      - 'data/verified-launch-catalog.json'
      - 'data/identity-registry.json'
      - 'data/auto-source-urls.json'
      - 'data/verified-time-evidence.json'
      - 'tests/test_cached_known_publication.py'
      # A regression test correction can unblock the publisher after a
      # verified source has already been ingested and a stale first-run
      # expectation prevented its public commit.
      - 'tests/test_chieti_marrucino_source.py'
      - 'tests/test_sassari_de_carolis_source.py'
      - 'tests/test_lucca_opera_source.py'
      - 'tests/test_lucca_work_panel_batch.py'
      - 'tests/test_auto_catalogue.py'
      - 'tests/test_savona_multiwork_identity.py'
      - 'site/theatre-profiles.json'
      # A verified multi-work source may be fully promotable before the
      # national refresh; publish it immediately after the regression merge.
      - 'tests/test_savona_real_evidence_publication.py'
      - '.github/workflows/publish-cached-catalog.yml'
permissions:
  contents: write
# Replay reviewed candidate statuses after Vicenza reconciliation; no network scan.
# Independent from the slow national refresh: a new source PR cannot cancel
# a short run that is already publishing verified cached opera recite.
concurrency:
  group: opera-atlas-cached-feed
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout latest canonical main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Consolidate verified Livorno Mascagni recital tickets
        run: python -m scripts.repair_livorno_mascagni_staging
      - name: Verify existing catalog and parser compatibility
        run: |
          # The first-party evidence checkpoint can add composite programs
          # independently of the previously generated public programs feed.
          # The immutable source registry may be ahead of the derived
          # content-addressed public channels after an approved PR merge.
          # Regenerate the dependent feeds before asserting consistency.
          python -m scripts.build_verified_catalog
          python -m scripts.publish_catalog_v2
          python -m scripts.publish_work_editorial
          python -m scripts.publish_programs
          python -m scripts.publish_work_posters
          # Reconcile the identity report against the just regenerated
          # canonical registry, not an outdated snapshot from a prior run.
          python -m scripts.work_identity_review
          python -m unittest discover -s tests -v
          python -m scripts.build_verified_catalog --check
          python -m scripts.publish_catalog_v2 --check
          python -m scripts.publish_work_editorial --check
      - name: Quarantine falsely attributed Petruzzelli stage IDs
        run: python -m scripts.repair_petruzzelli_mixed_program
      - name: Promote stored official evidence for already verified works
        run: python -m scripts.publish_cached_known
      - name: Complete source-verified new works from cached evidence
        run: |
          # Same shared fail-closed identity, factual editorial and authentic
          # artwork gates as the national refresh; NO network or bespoke venues.
          python -m scripts.auto_catalogue
          python -m scripts.publish_work_posters
          python -m scripts.publish_programs
          # Candidate status must close in the same atomic cached
          # publication as the newly verified canonical opera and recite.
          python -m scripts.reconcile_published_candidates
          python -m scripts.reconcile_work_intelligence_health
          python -m scripts.work_identity_review
      - name: Rebuild and validate public data without a new network crawl
        run: |
          python -m scripts.build_verified_catalog
          python -m scripts.publish_catalog_v2
          python -m scripts.publish_work_editorial
          python -m scripts.publish_venue_directory
          python -m scripts.sync_source_registry
          python -m scripts.source_coverage
          python -m scripts.recite_coverage
          python -m scripts.source_automation
          python -m scripts.build_verified_catalog --check
          python -m scripts.publish_catalog_v2 --check
          python -m scripts.publish_work_editorial --check
          python -m scripts.publish_work_posters --check
          python -m scripts.publish_programs --check
          python -m unittest discover -s tests -v
      - name: Publish validated cached JSON on main
        id: commit_catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/verified-launch-catalog.json data/identity-registry.json data/auto-source-urls.json data/verified-time-evidence.json site/work-synopses.json site/work-history.json site/performances.json public/catalog/v2/ public/catalog/work-editorial.json public/catalog/coverage.json public/catalog/recite-coverage.json public/catalog/source-automation.json public/catalog/venue-directory.json
          git add data/work-poster-evidence.json data/work-poster-health.json data/autonomous-catalogue-health.json public/catalog/work-posters.json public/catalog/programs.json
          git add data/season-index-candidates.json public/catalog/season-index-candidates.json data/candidate-reconciliation-health.json public/catalog/work-identity-review.json data/auto-work-intelligence-health.json
          if git diff --cached --quiet; then
            echo "deferred=false" >> "$GITHUB_OUTPUT"
            echo "The cached public catalog is already current."
          else
            git commit -m "data(catalog): publish cached verified recite [skip ci]"
            python -m scripts.safe_push_catalog
          fi
      - name: Retry on latest main after a safe push deferral
        if: steps.commit_catalog.outputs.deferred == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/dispatches" -f event_type=cached-catalog-retry
