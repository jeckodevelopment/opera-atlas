name: Audit 2026 — national four-batch reconciliation

on:
  pull_request:
    paths:
      - 'scripts/audit_2026_national_reconciliation.py'
      - 'tests/test_audit_2026_national_reconciliation.py'
      - '.github/workflows/audit-2026-national-reconciliation.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/audit_2026_national_reconciliation.py'
      - '.github/workflows/audit-2026-national-reconciliation.yml'
  workflow_run:
    workflows:
      - '2026 retrospective archives — national batch'
      - '2026 retrospective archives — continuation batch'
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opera-atlas-2026-national-reconciliation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Offline national reconciliation tests
        run: |
          python -m unittest tests.test_audit_2026_national_reconciliation tests.test_audit_2026_retrospective_reconciliation -v

  freshness:
    if: github.event_name != 'pull_request' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.inspect.outputs.ready }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false
      - name: Confirm four fresh scan slices before reconciliation
        id: inspect
        env:
          SOURCE_RUN_CREATED: ${{ github.event.workflow_run.created_at }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta
          from pathlib import Path
          folder=Path("public/diagnostics")
          names=["atlas-2026-retrospective-batch.json"]+[
              f"atlas-2026-retrospective-batch-{offset}.json"
              for offset in (240,480,720)]
          event_created=os.environ.get("SOURCE_RUN_CREATED","")
          if event_created:
              threshold=datetime.fromisoformat(event_created.replace("Z","+00:00"))-timedelta(minutes=2)
              verified=[]
              for name in names:
                  try:
                      payload=json.loads((folder/name).read_text(encoding="utf-8"))
                      stamp=datetime.fromisoformat(payload["checked_at"].replace("Z","+00:00"))
                      verified.append(payload.get("read_only") is True
                                      and payload.get("catalog_updated") is False
                                      and stamp>=threshold)
                  except (OSError, ValueError, KeyError, TypeError):
                      verified.append(False)
              ready=all(verified)
              print("Fresh 2026 scan sources:",dict(zip(names,verified)))
          else:
              ready=True
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as out:
              out.write(f"ready={str(ready).lower()}\n")
          PY

  reconcile:
    needs: [tests, freshness]
    if: github.ref == 'refs/heads/main' && needs.freshness.outputs.ready == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Validate inputs and reconcile all 2026 evidence
        run: |
          python -m scripts.audit_2026_national_reconciliation
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('public/diagnostics/atlas-2026-national-reconciliation-summary.json')
          x=json.loads(p.read_text(encoding='utf-8'))
          assert x['read_only'] is True and x['catalog_updated'] is False
          assert x['complete_seasons_certified'] == 0
          assert x['scan_offsets'] == [0,240,480,720]
          assert sum(x['observation_counts'].values()) == x['unique_observation_count']
          assert x['unique_observation_count'] >= 64
          print('NATIONAL_2026_VERIFIED_SUMMARY', json.dumps({
              'raw':x['raw_observation_count'],
              'unique':x['unique_observation_count'],
              'review':x['review_queue_count'],
              'statuses':x['observation_counts'],
          },ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opera-atlas-2026-national-reconciliation
          path: |
            public/diagnostics/atlas-2026-national-reconciliation.json
            public/diagnostics/atlas-2026-national-reconciliation-summary.json
          retention-days: 30

  publish:
    needs: reconcile
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093a
        with:
          name: opera-atlas-2026-national-reconciliation
          path: public/diagnostics
      - name: Publish summary only, latest-main safe
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp public/diagnostics/atlas-2026-national-reconciliation-summary.json /tmp/atlas-2026-national-reconciliation-summary.json
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin main
            git checkout -B publish-2026-national-reconciliation FETCH_HEAD
            mkdir -p public/diagnostics
            cp /tmp/atlas-2026-national-reconciliation-summary.json public/diagnostics/atlas-2026-national-reconciliation-summary.json
            git add -- public/diagnostics/atlas-2026-national-reconciliation-summary.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(audit): four-batch 2026 national reconciliation summary [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
