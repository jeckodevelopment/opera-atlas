name: 2026 retrospective archives — continuation batch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/audit_2026_retrospective_batch.py'
      - '.github/workflows/audit-2026-retrospective-continuation.yml'

permissions:
  contents: read

concurrency:
  group: opera-atlas-2026-retrospective-continuation
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: python -m unittest tests.test_audit_2026_retrospective_batch -v

  scan:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Scan next 240 independent historical archive leads
        run: |
          python -m scripts.audit_2026_retrospective_batch --allow-network --workers 5 --archive-offset 240 --max-detail-pages 750 --output public/diagnostics/atlas-2026-retrospective-batch-240.json
      - name: Verify no catalog publication or completeness claim
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('public/diagnostics/atlas-2026-retrospective-batch-240.json').read_text())
          assert report['year']==2026 and report['archive_offset']==240
          assert report['read_only'] is True and report['catalog_updated'] is False
          assert report['complete_seasons_certified']==0
          assert all(not v['complete_2026_calendar_verified'] for v in report['venues'])
          print('Archives attempted:',report['historical_archives_attempted'])
          print('Details attempted:',report['detail_pages_attempted'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opera-atlas-2026-retrospective-continuation-240
          path: public/diagnostics/atlas-2026-retrospective-batch-240.json
          retention-days: 30

  publish:
    needs: scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093a # v4
        with:
          name: opera-atlas-2026-retrospective-continuation-240
          path: public/diagnostics
      - name: Publish independent continuation diagnostics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp public/diagnostics/atlas-2026-retrospective-batch-240.json /tmp/atlas-2026-retrospective-batch-240.json
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin main
            git checkout -B publish-2026-retrospective-continuation FETCH_HEAD
            mkdir -p public/diagnostics
            cp /tmp/atlas-2026-retrospective-batch-240.json public/diagnostics/atlas-2026-retrospective-batch-240.json
            git add -- public/diagnostics/atlas-2026-retrospective-batch-240.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(audit): 2026 retrospective continuation diagnostics [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
