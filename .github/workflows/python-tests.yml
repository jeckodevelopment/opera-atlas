name: Python tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests (stdlib)
        run: |
          # Source-bound composite evidence may have been checkpointed since
          # the last public program snapshot; validate its derived feed first.
          python -m scripts.publish_catalog_v2
          python -m scripts.publish_work_editorial
          python -m scripts.publish_programs
          python -m scripts.publish_work_posters
          python -m unittest discover -s tests -v
