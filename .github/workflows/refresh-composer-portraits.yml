name: Refresh composer portraits
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_composer_portraits.py'
      - '.github/workflows/refresh-composer-portraits.yml'
      - 'data/composer-registry.json'
permissions:
  contents: write
concurrency:
  group: opera-atlas-composer-portraits
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
          fetch-depth: 0
      - name: Test and discover missing portraits
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_composer_portraits.py -v
          python -m scripts.refresh_composer_portraits --max-seconds 900 | tee -a "$GITHUB_STEP_SUMMARY"
          git add -- data/composer-portraits.json data/composer-portrait-review.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh verified composer portraits'
          # The catalog can advance during the network scan. Rebase only the
          # dedicated portrait commit; conflicts fail rather than overwrite.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
      - name: Assess acquisition outcome after persisting diagnostics
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("data/composer-portrait-review.json").read_text())
          status = report["status"]
          if status == "blocked":
              print("::error::Portrait acquisition blocked by upstream errors; diagnostics saved.")
              raise SystemExit(1)
          if status == "partial":
              print("::warning::Portrait acquisition incomplete; verified progress and diagnostics saved.")
          PY
