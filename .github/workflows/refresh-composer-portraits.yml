name: Refresh composer portraits
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh_composer_portraits.py'
      - '.github/workflows/refresh-composer-portraits.yml'
      - 'data/composer-registry.json'
permissions:
  contents: write
concurrency:
  group: opera-atlas-composer-portraits
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: main
      - name: Test and discover missing portraits
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p test_composer_portraits.py -v
          python -m scripts.refresh_composer_portraits
          git add -- data/composer-portraits.json data/composer-portrait-review.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: refresh verified composer portraits'
          git push origin HEAD:main
