name: Audit 2026 — editorial mass triage

on:
  pull_request:
    paths:
      - 'scripts/audit_2026_editorial_triage.py'
      - 'tests/test_audit_2026_editorial_triage.py'
      - '.github/workflows/audit-2026-editorial-triage.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/audit_2026_editorial_triage.py'
      - '.github/workflows/audit-2026-editorial-triage.yml'
  workflow_run:
    workflows: ['Audit 2026 — national four-batch reconciliation']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opera-atlas-2026-editorial-triage-${{ github.ref }}
  cancel-in-progress: false

jobs:
  triage:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Test safe triage rules
        run: python -m unittest tests.test_audit_2026_editorial_triage -v
      - name: Build nationwide read-only classification
        run: |
          python -m scripts.audit_2026_editorial_triage
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('public/diagnostics/atlas-2026-editorial-triage.json').read_text())
          assert x['read_only'] is True and x['catalog_updated'] is False
          assert x['complete_seasons_certified'] == 0
          assert x['input_review_count'] >= 0
          assert x['input_review_count'] == len(json.loads(Path('public/diagnostics/atlas-2026-national-reconciliation-summary.json').read_text())['review_queue'])
          assert x['event_groups'] <= x['input_review_count']
          assert sum(x['bucket_counts'].values()) == x['event_groups']
          assert all(not e['automatic_publication'] and not e['automatic_exclusion']
                     for e in x['review_groups'])
          print('Verified editorial triage',x['bucket_counts'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: opera-atlas-2026-editorial-triage
          path: public/diagnostics/atlas-2026-editorial-triage.json
          retention-days: 30

  publish:
    needs: triage
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093a
        with:
          name: opera-atlas-2026-editorial-triage
          path: public/diagnostics
      - name: Publish isolated diagnostic report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp public/diagnostics/atlas-2026-editorial-triage.json /tmp/atlas-2026-editorial-triage.json
          for attempt in 1 2 3 4 5 6 7 8; do
            git fetch --no-tags origin main
            git checkout -B publish-2026-editorial-triage FETCH_HEAD
            mkdir -p public/diagnostics
            cp /tmp/atlas-2026-editorial-triage.json public/diagnostics/atlas-2026-editorial-triage.json
            git add -- public/diagnostics/atlas-2026-editorial-triage.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'data(audit): 2026 editorial cross-index triage [skip ci]'
            if git push origin HEAD:main; then exit 0; fi
            sleep 3
          done
          exit 1
